<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
  </head>
  <body>
    <header class="main-header">
      <div class="theme-toggle-wrapper">
        <button type="button" class="theme-toggle">
          <svg
            class="theme-icon light-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-sun"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg
            class="theme-icon dark-icon icon-hidden"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-moon"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="main-content">
      <div class="loading-page hidden">
        <div class="spinner"></div>
      </div>
      <div class="error-content hidden">
        <svg
          class="error-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="feather feather-search"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <h2 class="error-title">No Results</h2>
        <p class="error-msg">No results found for "<span class="error-query"></span>"</p>
      </div>
      <div class="search-bar-wrapper in-main">
        <label class="search-bar-label" for="search-bar">What's the Weather?</label>
        <div class="search-bar-input-wrapper">
          <input type="text" id="search-bar" class="search-bar" placeholder="Enter a location..." />
          <button type="button" class="search-button">
            <svg
              class="search-button-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="feather feather-search"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="today-content hidden">
        <h2 class="location">Las Vegas</h2>
        <p class="temp">84</p>
        <p class="description">Mostly Cloudy</p>
        <div class="hilo-wrapper">
          <p class="high-temp">H:84°</p>
          <p class="low-temp">L:67°</p>
        </div>
      </div>
      <div class="ten-day-content-wrapper hidden">
        <div class="ten-day-label">
          <svg class="ten-day-label-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>calendar-month</title>
            <path
              d="M9,10V12H7V10H9M13,10V12H11V10H13M17,10V12H15V10H17M19,3A2,2 0 0,1 21,5V19A2,2 0 0,1 19,21H5C3.89,21 3,20.1 3,19V5A2,2 0 0,1 5,3H6V1H8V3H16V1H18V3H19M19,19V8H5V19H19M9,14V16H7V14H9M13,14V16H11V14H13M17,14V16H15V14H17Z"
            />
          </svg>
          <p class="ten-day-label-text">10-Day Forecast</p>
        </div>
        <ul class="ten-day-content"></ul>
      </div>
      <div class="day-hourly-content hidden">
        <p class="long-description">Warming up with a chance of rain tomorrow.</p>
        <ul class="hour-content"></ul>
      </div>
    </div>

    <footer class="main-footer">
      <a href="https://www.visualcrossing.com/weather-api/" class="src-link" target="_blank" rel="noopener noreferrer"
        >Powered by Visual Crossing Weather API</a
      >
    </footer>
  </body>
</html>
